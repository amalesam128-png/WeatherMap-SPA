<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeatherMap SPA</title>
    <!-- استيراد خط Google Fonts (Roboto) المطلوب -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <!-- مكتبة Leaflet.js للخرائط (خيار ممتاز وخفيف لتجنب تعقيد مفاتيح Google Maps) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <h1 class="page-title">تطبيق حالة الطقس - WeatherMap</h1>
    </header>

    <main class="container">
        <!-- نموذج البحث عن الموقع -->
        <form id="weather-form" class="weather-form">
            <input type="text" id="location-input" placeholder="أدخل اسم المدينة أو الموقع..." required autocomplete="off">
            <button type="submit" id="get-weather-btn">جلب الطقس</button>
        </form>

        <!-- مؤشر التحميل (Loading Spinner) -->
        <div id="loading-spinner" class="spinner hidden"></div>

        <!-- صندوق عرض الأخطاء -->
        <div id="error-card" class="error-card hidden"></div>

        <!-- حاوية الخريطة (بارتفاع 70% من الشاشة ) -->
        <div id="map" class="map-container"></div>
    </main>

    <!-- مكتبة Leaflet.js للخرائط -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="script.js"></script>
</body>
</html>
